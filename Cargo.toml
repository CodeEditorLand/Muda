[dependencies]
crossbeam-channel = "0.5"
dpi = "0.1"
keyboard-types = "0.7"
once_cell = "1"
serde = { version = "1", optional = true }
thiserror = "2"

[dev-dependencies]
image = "0.25"
tao = "0.30"
winit = "0.30"
wry = "0.45"

[features]
common-controls-v6 = []
default = ["libxdo", "gtk"]
gtk = ["dep:gtk"]
libxdo = ["dep:libxdo"]
serde = ["dep:serde", "dpi/serde"]

[lib]
path = "Source/lib.rs"

[package]
categories = ["gui"]
description = "Menu Utilities for Desktop Applications"
documentation = "https://docs.rs/muda"
edition = "2024"
keywords = ["windowing", "menu"]
license = "Apache-2.0 OR MIT"
name = "muda"
readme = "README.md"
repository = "https://github.com/amrbashir/muda"
rust-version = "1.71"
version = "0.16.1"

[target]

[target.'cfg(target_os = "linux")']

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }
libxdo = { version = "0.6.0", optional = true }

[target."cfg(target_os = \"macos\")"]

[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6.0"
objc2-app-kit = { version = "0.3.0", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "NSApplication",
  "NSCell",
  "NSEvent",
  "NSImage",
  "NSMenu",
  "NSMenuItem",
  "NSResponder",
  "NSRunningApplication",
  "NSView",
  "NSWindow",
] }
objc2-core-foundation = { version = "0.3.0", default-features = false, features = [
  "std",
  "CFCGTypes",
] }
objc2-foundation = { version = "0.3.0", default-features = false, features = [
  "std",
  "NSAttributedString",
  "NSData",
  "NSDictionary",
  "NSGeometry",
  "NSString",
  "NSThread",
] }
png = "0.17"

[target."cfg(target_os = \"windows\")"]

[target."cfg(target_os = \"windows\")".dependencies]

[target."cfg(target_os = \"windows\")".dependencies.windows-sys]
features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_Shell",
  "Win32_Globalization",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_SystemServices",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_System_LibraryLoader",
  "Win32_UI_Controls",
]
version = "0.59"
